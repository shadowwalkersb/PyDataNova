<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>v7 – ETL Pipeline Orchestration</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/pipeline.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>v7 – ETL Pipeline Orchestration</h1>

    <div class="controls">
      <label for="sourceSelect">Source:</label>
      <select id="sourceSelect">
        <option value="csv" selected>CSV</option>
      </select>

      <label for="datasetSelect">Dataset:</label>
      <select id="datasetSelect">
        <option value="nyc_taxi_sample" selected>Air Travel Sample (public CSV)</option>
        <option value="custom">Custom URL</option>
      </select>

      <input id="url" class="hidden" type="url" placeholder="https://example.com/data.csv" />
      <button id="runPipelineBtn">Run Pipeline</button>
    </div>

    <p id="status">Status: idle</p>

    <div class="panes">
      <section class="pane" id="polars-pane">
        <h2>Polars ETL</h2>
        <pre id="polars-output">Ready...</pre>
      </section>

        <div id="polars-summary"></div>

        <table id="polars-table">
          <thead id="polars-thead"></thead>
          <tbody id="polars-tbody"></tbody>
        </table>

      <div class="pane collapsed" id="pyspark-pane">
        <h2 id="pyspark-header">PySpark ETL &#9654;</h2>
        <pre id="pyspark-output">Collapsed (inactive)</pre>
    </div>

  </div>
</body>
</html>
